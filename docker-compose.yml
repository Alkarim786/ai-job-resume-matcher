services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: matcher
      POSTGRES_PASSWORD: matcher
      POSTGRES_DB: matcher
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcher -d matcher"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: matcher-backend
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://matcher:matcher@db:5432/matcher
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      EMBEDDER: ${EMBEDDER:-minilm}
      QUEUE: arq
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000
    # migrate -> seed demo data (idempotent) -> serve
    command: sh -c "alembic upgrade head && python -m app.seed.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  worker:
    image: matcher-backend
    environment: *backend-env
    command: arq app.worker.WorkerSettings
    volumes: [uploads:/data/uploads]
    depends_on:
      api: {condition: service_healthy}

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  uploads:
