name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-sqlite:
    name: Backend tests (SQLite, hash embedder)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  backend-postgres:
    name: Backend tests (PostgreSQL + pgvector HNSW, real migrations)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: matcher, POSTGRES_PASSWORD: matcher, POSTGRES_DB: matcher}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U matcher" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://matcher:matcher@localhost:5432/matcher
      TEST_DATABASE_URL: postgresql+asyncpg://matcher:matcher@localhost:5432/matcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head          # the tests run on the migrated schema, incl. HNSW indexes
      - run: pytest -q

  backend-minilm:
    name: Retrieval quality with the real MiniLM model
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt"}
      - run: pip install -r requirements-dev.txt -r requirements-ml.txt
      - run: TEST_EMBEDDER=minilm pytest -q tests/test_api.py -k "recommendations or ranked"
      - run: python -m eval.run_eval --embedder minilm --resumes 30 --jobs 20 --seed 7

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
